[project]
name = "wiki-racer"
version = "0.1.0"
description = "Outputs the shortest path between two given Wikipedia pages."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "nltk>=3.9.2",
    "requests>=2.32.5",
    "ruff>=0.14.10",
    "sentence-transformers>=5.2.0",
    "torch>=2.9.1",
    "wikipedia-api>=0.8.1",
]
